[project]
# `steppy` on PyPI is an unrelated project. The import package and the command
# stay `steppy`; `steppy.DISTRIBUTION` must match this name.
name = "steppy-dev"
version = "0.7.0"
description = "Generate Playwright pytest suites from Markdown scenarios, and turn their screenshots into multi-locale user guides"
readme = "README.md"
# PEP 639 SPDX expression; needs hatchling>=1.27 (pinned in [build-system]).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
keywords = ["playwright", "pytest", "e2e", "testing", "code-generation", "markdown", "user-guide", "screenshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Documentation",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.60.0,<1.61",
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# HTML test report (config `report.html`). JUnit XML needs no extra — it is
# built into pytest. Install with: pip install 'steppy-dev[report]'
report = ["pytest-html>=4.0.0"]
# Flaky-retry (config `report.retries` / `steppy run --retries N`). Install with:
# pip install 'steppy-dev[retry]'
retry = ["pytest-rerunfailures>=14.0"]
# Zstandard-compressed results bundles (`steppy bundle create`). Optional on
# purpose: without it bundles fall back to .tar.gz automatically, and the
# free path must never depend on an extra. Install with:
# pip install 'steppy-dev[bundle]'
bundle = ["zstandard>=0.22.0"]

[project.scripts]
steppy = "steppy.cli:app"

[project.urls]
Homepage = "https://github.com/Steppy-dev/steppy"
Source = "https://github.com/Steppy-dev/steppy"
Changelog = "https://github.com/Steppy-dev/steppy/blob/main/CHANGELOG.md"
Issues = "https://github.com/Steppy-dev/steppy/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
# `uv run ruff ...` (the lint/format gate in CLAUDE.md) resolves ruff from here.
# Without it the command fails with "program not found" and people reach for
# whatever ruff is on PATH — which is how the repo got reformatted by an old one.
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 120
# Ruff's formatter changed how it wraps a long `assert x, "msg"` in 0.9 (the
# 2025 style guide). An older ruff does not merely skip that rule, it reformats
# the other way — so running one silently rewrites files the repo just
# formatted, and the churn looks like someone's change. Refusing to run beats
# producing a diff nobody asked for.
required-version = ">=0.9"
# Ruff 0.16 formats Python code blocks inside Markdown. This repo's docs are
# full of deliberately-bad "BEFORE" snippets that exist to be ugly, so that
# would rewrite prose to make a point it is trying to disprove.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ONE `[tool.ruff.lint]` table, and it must stay that way: a second one is not a
# merge or an override, it is a TOML `duplicate key` error, and ruff's response
# is to parse nothing and lint nothing. The gate then "passes" by never running.
#
# E4/E7/E9/F is ruff's historical default set, made explicit. Leaving it implicit
# means the gate is defined by whichever ruff is installed: 0.16 widened the
# defaults, so the same unchanged tree went from clean to 745 errors purely on
# upgrade. Widening the set is a decision worth making deliberately, in a diff,
# not one that arrives with a version bump — so the defaults are repeated here
# rather than extended, because `select` replaces.
# TD = flake8-todos TODO-tag discipline.
# (E26 comment-whitespace rules are still ruff "preview" — add them once stable.)
select = ["E4", "E7", "E9", "F", "TD"]

[tool.ruff.lint.per-file-ignores]
# Scaffold script: its TODO placeholders + commented examples are intentional.
"seed/**" = ["TD"]

# Generate the bundled template tree (src/steppy/templates/) from the canonical
# repo-root templates/ before every build — for the wheel, sdist, AND editable
# installs (FLAWS §4.1). See hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/steppy"]
# The bundled template/skill trees + CHANGELOG are gitignored build artifacts
# regenerated by hatch_build.py and injected via force-include below. Exclude
# them from the normal (packages) file walk so a build WITHOUT a VCS present
# — e.g. the Docker worker image, whose context is a bare source tree with no
# .git — doesn't also pick them up and then abort with "A second file is being
# added to the wheel archive at the same path". When a VCS IS present the
# gitignore already excludes them from the walk; this just makes that same
# exclusion VCS-independent. force-include still injects them exactly once.
exclude = [
    "src/steppy/templates",
    "src/steppy/skills",
    "src/steppy/CHANGELOG.md",
]

# The generated template + skill trees are gitignored, so hatchling's VCS-based
# file selection would skip them — force them into the wheel as build artifacts.
[tool.hatch.build.targets.wheel.force-include]
"src/steppy/templates" = "steppy/templates"
"src/steppy/skills" = "steppy/skills"
"src/steppy/CHANGELOG.md" = "steppy/CHANGELOG.md"
